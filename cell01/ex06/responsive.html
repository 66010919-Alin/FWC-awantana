<!DOCTYPE html>
<html>
<head>
  <title>Tab</title>
  <style>
    body {
      margin: 0;
    }
    table {
      width: 100%;
      height: 100vh;
      border-collapse: collapse;
    }
    .first-cell {
      background-color: #d741d2;
      width: 50%;
    }
    .second-cell {
      background-color: #f174c3;
      width: 50%;
    }
  </style>
</head>
<body>

  <table border="1">
    <tr>
      <td class="first-cell">First cell</td>
      <td class="second-cell">Second cell</td>
    </tr>
  </table>

</body>
</html>
