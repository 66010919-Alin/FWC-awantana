<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding-top: 70px; 
        background: #000000;
        color: #ffffff;
    }

        .navbar {
            position: fixed;          /* ติดด้านบนตลอดตอนเลื่อน */
            top: 0; left: 0;
            width: 100%;
            height: 70px;
            background: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid #ffffff;
            z-index: 1000;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color:#ffffff;
            text-decoration: none;
        }
        .menu {
            display: flex;            /* เมนูเรียงแนวนอน */
            list-style: none;         /* เอาจุดหน้า list ออก */
            gap: 24px;
        }
        .menu a {
            font-size: 20px;
            color: #ffffff;
            text-decoration: none;    /* เอาเส้นใต้ออก */
        }
        .menu a:hover { text-decoration: underline; }

        section { scroll-margin-top: 70px; min-height: 100vh; padding: 30px; }


        #about {
            text-align: center;
        }

        #about .photo {
            display: block;
            width: 330px;
            height: 395px;
            object-fit: cover;
            margin: 0 auto 40px;
        }

        #about h2 {
            font-size: 70px;
            margin-bottom: 35px;
        }

        #about p {
            font-size: 28px;
            line-height: 1.5;
        }

        /* ทำให้ Home อยู่ตรงกลาง */
        #home {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #home h1 {
            font-size: 60px;
        }

        /* จัด Skills */
        #skills {
            padding: 70px 10%;
            text-align: center;
        }

        #skills h2 {
            font-size: 60px;
            margin-bottom: 30px;
        }

        #skills ul {
            font-size: 28px;
            line-height: 1.8;
            list-style: none;
        }
        #skills .photo {
            width: 300px;
            height: 300px;
            object-fit: cover;
            margin: 30px auto;
        }
        #skills .photo1 {
            width: 600px;
            height: 300px;
            object-fit: cover;
            margin: 30px auto;
        }

        /* จัด Projects */
        #projects {
            text-align: center;
        }

        #projects h2 {
            font-size: 60px;
            margin-bottom: 30px;
        }

        #projects p {
            font-size: 28px;
        }

        #projects .photo {
            width: 1000px;
            height: 600px;
        }

        /* จัด Contact */
        #contact {
            padding: 70px 10%;
        }

        #contact h2 {
            font-size: 60px;
            margin-bottom: 30px;
        }

        #contact a {
            font-size: 25px;
        }

        /* ===== รองรับมือถือ ===== */

        @media (max-width: 768px) {

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 14px;
            }

            #home h1 {
                font-size: 40px;
            }

            #about .photo {
                width: 230px;
                height: 280px;
            }

            #about h2 {
                font-size: 45px;
            }

            #about p {
                font-size: 19px;
            }

            #skills h2,
            #projects h2,
            #contact h2 {
                font-size: 45px;
            }

            #skills ul {
                font-size: 20px;
            }

            #projects p {
                font-size: 20px;
            }

            #contact a {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

  <nav class="navbar">
    <a href="#home" class="logo">Portfolio</a>
    <ul class="menu">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <section id="about" class="section dark">
    <img src="images/guide/guide 1.jpg" alt="Guide" class="photo">
    <h2>About Me</h2>
    <p>Hello my name is Thanapat Khaekam AKA Guide from KMITL </p>
  </section>
  

  <section id="skills" class="section dark">
    <h2>My Skills</h2>
    <div class="skill-images">
        <img src="images/guide/skill 1.1.jpg" alt="Guide" class="photo1">
        <img src="images/guide/skill 1.0.jpg" alt="Guide" class="photo">
    </div>
    <h2>Music Producer </h2>
    <h3>In love with sound i always trying to level up my mastering skills. </h3>
  </section>

  <section id="projects" class="section dark">
    <h2>Projects</h2>
    <p>Projects</p>
    <img src="images/guide/project 1.0.jpg" alt="Guide" class="photo">
    <p>...</p>
  </section>

  <section id="contact" class="section">
    <h2>Contact</h2>
    <a href="https://github.com/tkhaekam">GitHub</a> |
    <a href="https://www.instagram.com/thanapatkh1?stkn=dHZia2JsdGVjZ2Y2&utm_source=qr">Instagram</a> |
    
  </section>

</body>
</html>
